# Maze layout: single source of truth for the world file, the ground-truth
# map, the DQN goal sampler and the SLAM accuracy checker.
#
# Grid coordinates (as drawn in Figure 1 of the assignment):
#   - grid lines are numbered 0..cols left->right (gx) and 0..rows top->bottom (gy)
#   - a wall segment is [gx1, gy1, gx2, gy2] and must be horizontal or vertical
#
# World coordinates (Gazebo / ROS map frame):
#   - the centre of `origin_cell` is world (0, 0); the robot spawns there facing +x
#   - +x = right in the figure, +y = up in the figure
#   - spawning at (0,0,0) makes map == odom == world at start, which is what
#     slam_toolbox, AMCL's initial pose and the DQN environment all assume.

cell_size: 0.5         # m, from Figure 1
cols: 6
rows: 6
wall_thickness: 0.05   # m -> 0.45 m clear corridor vs 0.21 m Burger footprint
wall_height: 0.30      # m -> above the LiDAR plane (~0.18 m)
origin_cell: [0, 5]    # [col, row]: bottom-left cell of the figure

walls:
  # Outer boundary
  - [0, 0, 6, 0]
  - [0, 6, 6, 6]
  - [0, 0, 0, 6]
  - [6, 0, 6, 6]

  # Interior walls read from Figure 1 (thick lines)
  # Verticals
  - [2, 0, 2, 1]
  - [4, 0, 4, 1]
  - [1, 1, 1, 4]
  - [3, 1, 3, 2]
  - [5, 1, 5, 2]
  - [2, 2, 2, 3]
  - [3, 3, 3, 4]
  - [5, 3, 5, 5]
  # Horizontals
  - [2, 2, 5, 2]
  - [4, 3, 6, 3]
  - [1, 4, 4, 4]
  - [0, 5, 1, 5]
  - [2, 5, 5, 5]
